name: markdown_reader
description: H2 Readmd, a local Markdown reader and editor for Windows.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  gpt_markdown: 1.4.0
  filegate: 1.10.0
  url_launcher: 6.3.3
  window_manager: 0.5.2
  # Already used by gpt_markdown; synchronize its separate Material theme.
  material_ui: 1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
